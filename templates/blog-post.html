<!DOCTYPE html>
<html lang="$lang$">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="$excerpt$" />
  <title>$title$ — Dinnizer</title>
  <link rel="stylesheet" href="../../css/style.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%230D2137'/><text y='.85em' font-size='70' x='15'>D</text></svg>" />
</head>
<body>

<nav>
  <div class="nav-inner">
    <a class="nav-logo" href="../../">Dinnizer<span>.</span></a>
    <ul class="nav-links">
      <li><a href="../../#services">Services</a></li>
      <li><a href="../../#vision">Vision</a></li>
      <li><a href="../">Blog</a></li>
      <li><a href="../../#contact">Contact</a></li>
    </ul>
    <div class="nav-actions">
      <div class="lang-toggle" role="group" aria-label="Language">
        <button data-lang="en" class="active">EN</button>
        <button data-lang="fr">FR</button>
      </div>
      <button class="nav-hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</nav>

<header class="post-header">
  <div class="container">
    <a href="../" class="post-back">← Blog</a>
    <h1>$title$</h1>
    <div class="post-meta">
      $date$ · $author$
      $if(tags)$
      · $for(tags)$<span class="tag">$tags$</span>$sep$ $endfor$
      $endif$
    </div>
  </div>
</header>

<article class="post-body">
$body$
</article>

<footer>
  <div class="container">
    <span>© 2026 Dinnizer SAS — All rights reserved.</span>
    &nbsp;·&nbsp;
    <a href="mailto:contact@dinnizer.com">contact@dinnizer.com</a>
  </div>
</footer>

<script src="../../js/i18n.js"></script>
</body>
</html>
